services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: RH_chatbot-backend
    volumes:
      - /home/paulvidouze/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8002:8000"
    environment:
      - OLLAMA_HOST=http://10.75.12.5:11434
      - CONTEXT_SIZE=22000
      - TEMPERATURE=0.4
      - DEFAULT_LLM=gemma4:e4b
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface
      - EMBEDDING_MODEL=embeddinggemma:latest
      # ← Qdrant joignable via son nom de service sur qdrant_net
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CHATBOT_ROLE=RH
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
      - qdrant_net   # ← rejoint le réseau Qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: RH_chatbot-frontend
    ports:
      - "8503:8501"
    environment:
      - API_URL=http://backend:8000
      - STREAMLIT_BROWSER_SERVER_ADDRESS=10.75.12.5
      - CONTEXT_SIZE=22000
      - TEMPERATURE=0.4
      - DEFAULT_LLM=gemma4:e4b
      - DEFAULT_VLM=gemma4:e4b
      - PAYLOAD_DEBUG=hide
      - IS_DEV=yes
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=5000
      - STREAMLIT_BROWSER_SERVER_PORT=8503
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      - backend

networks:
  default: {}
  qdrant_net:
    external: true